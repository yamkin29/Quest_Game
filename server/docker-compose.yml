# Local development PostgreSQL for the Quest Game API.
# Start:  docker compose up -d
# Stop:   docker compose down
# All settings come from server/.env (see .env.example).

services:
  db:
    image: postgres:17-alpine
    container_name: quest-game-db
    restart: unless-stopped
    environment:
      # ":?" makes Compose fail fast with a clear message if a value is missing from .env
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in server/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in server/.env}
    ports:
      # Host port is configurable because 5432 is taken by another project on this machine
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # Named volume keeps data between container restarts and rebuilds
      - quest-game-db-data:/var/lib/postgresql/data
    healthcheck:
      # "$$" defers variable resolution to the shell inside the container
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  quest-game-db-data:
